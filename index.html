function isSuperAdmin(user) {
  if (!user) return false;
  return user.role === 'superadmin';

  }
  return 'viewer';

class SearchEngine {

  static parse(raw) {
    const criteria = {
      query: ''

    tokens.forEach(t => {
      const clean = t.replace(/^"(.*)"$/, '$1');
      const l = clean.toLowerCase();
      if (l.startsWith('from:')) {
        criteria.from = clean.slice(5).trim();
      } else if (l.startsWith('type:')) {
        const v = clean.slice(5).trim().toUpperCase();
        if (['IC', 'OOC', 'DM', 'NPC'].includes(v)) criteria.type = v;
      } else if (l.startsWith('in:')) {
        criteria.in = clean.slice(3).trim();
      } else if (l === 'has:link') {
        criteria.hasLink = true;
      } else {
        textParts.push(clean);

    });

    return criteria;
  }

    const chanMap = new Map();
    if (Array.isArray(channels)) {

        if (c && c.id) chanMap.set(c.id, (c.name || '').toLowerCase());
      });
    }
    const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/i;

      if (!msg) return false;
      if (criteria.type && msg.speakerType !== criteria.type) return false;

        const speakerMatch = (msg.speakerName || '').toLowerCase().includes(q);

function App() {
  const [userProfile, setUserProfile] = useState(() => {
    const accs = AccountManager.getAccounts();
    const activeHandle = AccountManager.getActiveHandle();
    return (activeHandle && accs[activeHandle.toLowerCase()]) || null;
  });

  const [activeTab, setActiveTab] = useState('chat');
  const [isOnline, setIsOnline] = useState(() => typeof navigator !== 'undefined' ? navigator.onLine : true);

  // App data state

  const [activeWorldId, setActiveWorldId] = useState(null);
  const [channels, setChannels] = useState([]);
  const [activeChannelId, setActiveChannelId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [dmMessages, setDmMessages] = useState([]);
  const [wikiEntries, setWikiEntries] = useState([]);
  const [invites, setInvites] = useState([]);
  const [customNpcs, setCustomNpcs] = useState(() => AccountManager.getTempNpcs(AccountManager.getActiveHandle()));
  const [directory, setDirectory] = useState([]);
  const [theme, setTheme] = useState('dark');
  const [unreadChannelIds, setUnreadChannelIds] = useState(() => new Set());
  // Private per-account scratch pad notes on wiki/character entries: { [entryId]: content }
  const [scratchpadNotes, setScratchpadNotes] = useState({});

    const accs = AccountManager.getAccounts();
    const activeHandle = AccountManager.getActiveHandle();
    const profile = (activeHandle && accs[activeHandle.toLowerCase()]) || null;
    return {
      id: profile ? 'ooc_' + profile.handle.replace('@', '') : 'ooc_player',
      name: profile?.name || 'Player',
      type: 'OOC',
      avatarUrl: profile?.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',

    const handleOffline = () => setIsOnline(false);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);

                  setChannels(restored.channels || []);

                  setDmMessages(restored.dmMessages || []);
                  setWikiEntries(restored.wikiEntries || []);
                  setInvites(restored.invites || []);
                  if (data.directory) setDirectory(data.directory);
                  if (restored.worlds && restored.worlds.length > 0) {
                    setActiveWorldId(restored.worlds[0].id);
                  }
                  return;
                }
              }
            } catch (syncErr) {
              console.warn('[Auto-Sync] Could not restore vault:', syncErr);
            }
          }
        }
        const uniqueWorlds = (data.worlds || []).filter((w, i, arr) => arr.findIndex(x => x.id === w.id) === i);
        setWorlds(uniqueWorlds);
        if (data.worlds && data.worlds.length > 0) {
          if (!activeWorldId || !data.worlds.some(w => w.id === activeWorldId)) {
            setActiveWorldId(data.worlds[0].id);
          }
        } else {
          setActiveWorldId(null);
        }

        const uniqueChannels = (data.channels || []).filter((c, i, arr) => arr.findIndex(x => x.id === c.id) === i);
        setChannels(uniqueChannels);
        if (data.channels && data.channels.length > 0) {
          const worldChans = data.channels.filter(c => c.worldId === (activeWorldId || data.worlds?.[0]?.id));
          if (worldChans.length > 0) {
            setActiveChannelId(worldChans[0].id);
          }
        }

        setMessages(data.messages || []);
        setDmMessages(data.dmMessages || []);
        setWikiEntries(data.wikiEntries || []);
        setInvites(data.invites || []);
        setScratchpadNotes((data.scratchpadNotes || []).reduce((acc, n) => { acc[n.entryId] = n.content; return acc; }, {}));
        if (data.directory) setDirectory(data.directory);
      }
    } catch (e) {
      console.warn('[Bootstrap] Server unreachable, using local state');
    }
  };

  useEffect(() => {
    if (userProfile?.handle) {

  }, [userProfile?.handle]);

  // Temporary Spawned Characters: persist locally per-account until explicitly deleted.
  // skipNextNpcSaveRef guards against the save effect below firing in the SAME
  // commit as a handle switch, where `customNpcs` still holds the *previous*
  // account's (stale) list - without this guard, logging in/out would
  // immediately overwrite the newly-loaded account's saved NPCs with the
  // stale list from whichever account/state was active a moment ago.
  const skipNextNpcSaveRef = useRef(true);
  useEffect(() => {
    skipNextNpcSaveRef.current = true;
    setCustomNpcs(AccountManager.getTempNpcs(userProfile?.handle));
  }, [userProfile?.handle]);

  useEffect(() => {
    if (skipNextNpcSaveRef.current) {
      skipNextNpcSaveRef.current = false;
      return;
    }
    if (userProfile?.handle) {
      AccountManager.saveTempNpcs(userProfile.handle, customNpcs);
    }
  }, [customNpcs, userProfile?.handle]);

  // Live refs so the long-lived WebSocket handler always sees current values
  const worldsRef = useRef(worlds);
  useEffect(() => { worldsRef.current = worlds; }, [worlds]);
  const activeTabRef = useRef(activeTab);
  useEffect(() => { activeTabRef.current = activeTab; }, [activeTab]);
  const activeChannelIdRef = useRef(activeChannelId);
  useEffect(() => { activeChannelIdRef.current = activeChannelId; }, [activeChannelId]);

  // 3. WebSocket Connection for live real-time sync
  useEffect(() => {
    if (!userProfile?.handle) return;

    let ws = null;
    let reconnectTimeout = null;

    const connectWs = () => {
      try {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          setIsOnline(true);
          ws.send(JSON.stringify({ type: 'IDENTIFY', handle: userProfile.handle }));
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'PROFILE_UPDATED') {
              if (data.user) {
                setDirectory(prev => {
                  const idx = prev.findIndex(u => (u.handle || '').toLowerCase() === (data.user.handle || '').toLowerCase());
                  if (idx >= 0) {
                    const next = [...prev];
                    next[idx] = { ...next[idx], ...data.user };
                    return next;
                  }
                  return [...prev, data.user];
                });
                if ((data.user.handle || '').toLowerCase() === myHandle) {
                  setUserProfile(prev => ({ ...(prev || {}), ...data.user }));
                  AccountManager.saveAccount(data.user);
                }
              }
            } else if (data.type === 'NEW_MESSAGE') {
              const msg = data.message;
              const isMyWorld = worldsRef.current.some(w => w.id === msg.worldId);
              if (isMyWorld) {
                setMessages(prev => {
                  if (prev.some(m => m.id === msg.id)) return prev;
                  return [...prev, msg];
                });
                const isFromMe = (msg.speakerHandle || msg.narratorHandle || '').toLowerCase() === myHandle;
                const isViewingChannel = activeTabRef.current === 'chat' && activeChannelIdRef.current === msg.channelId;
                if (!isFromMe && !isViewingChannel) {
                  setUnreadChannelIds(prev => {
                    if (prev.has(msg.channelId)) return prev;
                    const next = new Set(prev);
                    next.add(msg.channelId);
                    return next;
                  });
                  SoundFX.play('pop');
                }
              }
            } else if (data.type === 'NEW_DM') {
              setDmMessages(prev => {
                if (prev.some(m => m.id === data.message.id)) return prev;
                return [...prev, data.message];
              });
              if ((data.message.recipientHandle || '').toLowerCase() === myHandle) {
                SoundFX.play('pop');
              }
            } else if (data.type === 'DMS_READ') {
              setDmMessages(prev => prev.map(m => {
                if ((m.recipientHandle || '').toLowerCase() === data.readerHandle.toLowerCase() &&
                    (m.senderHandle || '').toLowerCase() === data.contactHandle.toLowerCase()) {
                  return { ...m, status: 'read' };
                }
                return m;
              }));
            } else if (data.type === 'DMS_THREAD_DELETED') {
              setDmMessages(prev => prev.filter(m => {
                const s = (m.senderHandle || '').toLowerCase();
                const r = (m.recipientHandle || '').toLowerCase();
                const c1 = data.userHandle.toLowerCase();
                const c2 = data.contactHandle.toLowerCase();
                return !((s === c1 && r === c2) || (s === c2 && r === c1));
              }));
            } else if (data.type === 'WIKI_UPDATED') {
              setWikiEntries(prev => {
                const idx = prev.findIndex(w => w.id === data.entry.id);
                if (idx >= 0) {
                  const updated = [...prev];
                  updated[idx] = data.entry;
                  return updated;
                }
                return [...prev, data.entry];
              });
            } else if (data.type === 'WIKI_DELETED') {
              setWikiEntries(prev => prev.filter(w => w.id !== data.entryId));
            } else if (data.type === 'WORLD_CREATED') {
              const isCreator = (data.world.creatorHandle || '').toLowerCase() === myHandle;
              const isMember = Array.isArray(data.world.members) && data.world.members.some(m => (m.handle || '').toLowerCase() === myHandle);
              if (isCreator || isMember) {
                setWorlds(prev => {
                  if (prev.some(w => w.id === data.world.id)) return prev;
                  return [...prev, data.world];
                });
                if (data.channels) {
                  setChannels(prev => {
                    let next = [...prev];
                    data.channels.forEach(ch => {
                      if (!next.some(c => c.id === ch.id)) next.push(ch);
                    });
                    return next;
                  });
                }
              }
            } else if (data.type === 'WORLD_UPDATED') {
              const isCreator = (data.world.creatorHandle || '').toLowerCase() === myHandle;
              const isMember = Array.isArray(data.world.members) && data.world.members.some(m => (m.handle || '').toLowerCase() === myHandle);
              if (isCreator || isMember) {
                setWorlds(prev => {
                  if (prev.some(w => w.id === data.world.id)) {
                    return prev.map(w => w.id === data.world.id ? data.world : w);
                  }
                  return [...prev, data.world];
                });
              } else {
                setWorlds(prev => prev.filter(w => w.id !== data.world.id));
              }
            } else if (data.type === 'SERVER_DATA_RESTORED') {
              fetchBootstrap(userProfile?.handle);
            } else if (data.type === 'WORLD_MEMBERS_UPDATED') {
              if (data.world) {
                const isCreator = (data.world.creatorHandle || '').toLowerCase() === myHandle;
                const isMember = Array.isArray(data.world.members) && data.world.members.some(m => (m.handle || '').toLowerCase() === myHandle);
                if (isCreator || isMember) {
                  setWorlds(prev => {
                    const idx = prev.findIndex(w => w.id === data.world.id);
                    if (idx >= 0) {
                      const next = [...prev];
                      next[idx] = data.world;
                      return next;
                    }
                    return [...prev, data.world];
                  });
                  if (data.channels) {
                    setChannels(prev => {
                      let next = [...prev];
                      data.channels.forEach(ch => {
                        if (!next.some(c => c.id === ch.id)) next.push(ch);
                      });
                      return next;
                    });
                  }
                } else {
                  setWorlds(prev => prev.filter(w => w.id !== data.world.id));
                }
              }
            } else if (data.type === 'WORLD_DELETED') {
              setWorlds(prev => prev.filter(w => w.id !== data.worldId));
              setChannels(prev => prev.filter(c => c.worldId !== data.worldId));
              setMessages(prev => prev.filter(m => m.worldId !== data.worldId));
              setWikiEntries(prev => prev.filter(w => w.worldId !== data.worldId));
              setActiveWorldId(prev => prev === data.worldId ? (worlds.find(w => w.id !== data.worldId)?.id || null) : prev);
            } else if (data.type === 'CHANNEL_CREATED') {
              setChannels(prev => {
                if (prev.some(c => c.id === data.channel.id)) return prev;
                return [...prev, data.channel];
              });
            } else if (data.type === 'CHANNEL_UPDATED') {
              setChannels(prev => prev.map(c => c.id === data.channel.id ? data.channel : c));
            } else if (data.type === 'CHANNEL_DELETED') {
              setChannels(prev => prev.filter(c => c.id !== data.channelId));
              setMessages(prev => prev.filter(m => m.channelId !== data.channelId));
            } else if (data.type === 'NEW_INVITE') {
              setInvites(prev => [...prev, data.invite]);
              if (data.dm) {
                setDmMessages(prev => [...prev, data.dm]);
              }
              if ((data.invite.toHandle || '').toLowerCase() === myHandle) {
                SoundFX.play('join');
              }
            } else if (data.type === 'WORLD_MEMBERS_UPDATED') {
              setWorlds(prev => prev.map(w => w.id === data.worldId ? { ...w, members: data.members } : w));
            } else if (data.type === 'WORLD_OWNERSHIP_TRANSFERRED') {
              setWorlds(prev => prev.map(w => {
                if (w.id === data.worldId) {
                  return { ...w, creatorHandle: data.newCreatorHandle };
                }
                return w;
              }));
            }
          } catch (err) {
            console.error('[WS Message Error]', err);
          }
        };

        ws.onclose = () => {
          reconnectTimeout = setTimeout(connectWs, 3000);
        };

        ws.onerror = () => {
          ws.close();
        };
      } catch (e) {}
    };

    connectWs();

      if (ws) ws.close();
      if (reconnectTimeout) clearTimeout(reconnectTimeout);
    };
  }, [userProfile?.handle, myHandle]);

  // Keep activeChannelId aligned with activeWorld
  const activeWorld = worlds.find(w => w.id === activeWorldId) || worlds[0];
  const worldChannels = channels.filter(c => c.worldId === activeWorld?.id);
  const visibleWorldChannels = worldChannels.filter(c => !c.archived);
  const activeChannel = worldChannels.find(c => c.id === activeChannelId) || visibleWorldChannels[0] || worldChannels[0];
  const channelDropdownList = (activeChannel && activeChannel.archived) ? [activeChannel, ...visibleWorldChannels] : visibleWorldChannels;

  useEffect(() => {

  useEffect(() => {

      try {
        const snapshot = {
          worlds: worlds.reduce((acc, w) => { acc[w.id] = w; return acc; }, {}),
          channels: channels.reduce((acc, c) => { acc[c.id] = c; return acc; }, {}),

        };

    }
  }, [worlds, channels, messages, dmMessages, wikiEntries, invites]);


  useEffect(() => {
    if (activeWorld && (!activeChannelId || !worldChannels.some(c => c.id === activeChannelId))) {
      if (visibleWorldChannels.length > 0) {
        setActiveChannelId(visibleWorldChannels[0].id);
      } else if (worldChannels.length > 0) {
        setActiveChannelId(worldChannels[0].id);
      }
    }
  }, [activeWorldId, channels]);

  // Keep active persona synced with player OOC profile
  useEffect(() => {
    if (userProfile) {
      setActivePersona(prev => {
        if (!prev || prev.type === 'OOC' || prev.id === 'ooc_player') {
          return {
            id: `ooc_${(userProfile.handle || 'player').replace('@', '')}`,
            name: userProfile.name,
            type: 'OOC',
            handle: userProfile.handle,
            avatarUrl: userProfile.avatarUrl || prev?.avatarUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(userProfile.name)}`
          };
        }
        return prev;
      });
    }
  }, [userProfile?.avatarUrl, userProfile?.name, userProfile?.handle]);

  // Handlers for mutations
  const handleSendMessage = async (content, persona, imageUrl) => {
    if (!activeWorld || !activeChannel) return;
    const clientMsgId = `msg_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
    const payload = {
      clientMessageId: clientMsgId,
      worldId: activeWorld.id,
      channelId: activeChannel.id,
      content,
      imageUrl,
      persona,
      narratorName: userProfile.name,
      narratorHandle: userProfile.handle
    };

    // Optimistic UI update with identical ID to prevent duplicate on PC/WebSocket
    const tempMsg = {
      id: clientMsgId,
      ...payload,
      speakerName: persona.name,
      speakerType: persona.type,
      speakerHandle: persona.handle || userProfile.handle,
      avatarUrl: persona.avatarUrl,
      timestamp: new Date().toISOString()
    };
    setMessages(prev => {
      if (prev.some(m => m.id === clientMsgId)) return prev;
      return [...prev, tempMsg];
    });

    try {
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (e) {}
  };

    setDmMessages(prev => {

  const handleSendInvite = async (worldId, role, recipientHandle) => {

        })

          return [...prev, data.dm];
        });

      });
