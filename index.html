function ImageCropperModal({

  const [zoom, setZoom] = useState(1);

    x: 0,

    img.src = imageSrc;

  const drawCanvas = () => {

    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    ctx.clearRect(0, 0, width, height);

    // 1. Draw transformed image
    ctx.save();
    ctx.translate(width / 2 + pan.x, height / 2 + pan.y);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.scale(zoom, zoom);
    const img = imgRef.current;
    const aspect = img.width / img.height;
    let drawW, drawH;
    if (aspect > 1) {
      drawH = 260;
      drawW = 260 * aspect;
    } else {
      drawW = 260;
      drawH = 260 / aspect;
    }
    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.restore();

    // 2. Draw darkened vignette mask outside crop frame (240x240)
    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    const cropSize = 240;
    const cropX = (width - cropSize) / 2;
    const cropY = (height - cropSize) / 2;
    ctx.beginPath();
    ctx.rect(0, 0, width, height);
    if (cropShape === 'circle') {
      ctx.arc(width / 2, height / 2, cropSize / 2, 0, Math.PI * 2, true);
    } else {
      ctx.rect(cropX + cropSize, cropY, -cropSize, cropSize);
    }
    ctx.fill('evenodd');
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(6, 182, 212, 0.6)';
    ctx.shadowBlur = 10;
    if (cropShape === 'circle') {

      ctx.stroke();
    } else {
      ctx.strokeRect(cropX, cropY, cropSize, cropSize);
    }
    ctx.restore();

    // Visual Indicators: Rule of Thirds dashed grid
    ctx.save();
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(cropX + cropSize / 3, cropY);
    ctx.lineTo(cropX + cropSize / 3, cropY + cropSize);
    ctx.moveTo(cropX + cropSize * 2 / 3, cropY);
    ctx.lineTo(cropX + cropSize * 2 / 3, cropY + cropSize);
    ctx.moveTo(cropX, cropY + cropSize / 3);
    ctx.lineTo(cropX + cropSize, cropY + cropSize / 3);
    ctx.moveTo(cropX, cropY + cropSize * 2 / 3);
    ctx.lineTo(cropX + cropSize, cropY + cropSize * 2 / 3);
